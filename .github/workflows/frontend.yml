name: WebUI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run lint
      - run: npm --prefix web test
      - run: npm --prefix web run build
      - name: Verify committed assets
        run: git diff --exit-code -- internal/cli/webassets
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Check bundled gateway
        run: go test ./internal/cli -run 'TestWebServesBundledUIAndAssetsWithoutCheckout|TestRunWeb'
      - name: Install test browser
        run: node web/node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Browser regression
        run: |
          npm --prefix web run preview -- --host 127.0.0.1 --port 4173 &
          frontend_preview_pid=$!
          trap 'kill "$frontend_preview_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          WEBUI_URL=http://127.0.0.1:4173 npm --prefix web run e2e
