        config_path:
          type: string
          description: 可选配置文件。相对路径以 canonical 项目 root 为基准；省略时使用网关启动配置。已打开项目收到不同的非空配置路径返回 409，不启动第二个 Manager。
      additionalProperties: false
      description: JSON body 上限 64 KiB，拒绝未知字段与尾随 JSON。
    Project:
      type: object
      required:
      - id
      - name
      - root
      - model
      - manager_id
      - runtime_state
      - busy
      - pending
      - task_running
      properties:
        id:
          type: string
          description: project- 加 canonical root 的 SHA-256 十六进制摘要。路径别名返回相同 ID；相同 ID 不代表跨进程实例互斥。
        name:
          type: string
        root:
          type: string
          description: 服务端归一化后的路径。
        model:
          type: string
        manager_id:
          type: string
          const: manager
        runtime_state:
          type: string
          enum:
          - open
          - closed
          - error
          description: error 表示 Manager 主循环已因不可恢复错误退出；不能继续接收新消息，需要显式重新打开项目。
        busy:
          type: boolean
          description: Open Manager busy state; after Manager failure, only surviving task/model/tool/memory activity keeps this true. An unserviceable pending report alone does not.
        pending:
          type: integer
          minimum: 0
        task_running:
          type: boolean
          description: Whether metrics.tasks.running > 0; includes dependency waits, not model concurrency.
        error:
          type: string
          description: runtime_state=error 时提供的 Manager 失败原因；其他状态省略。
      description: 一个 Project 对应 canonical root；当前网关进程内复用一个 Manager。Session 不作为可新建的 UI 资源。项目 ID 可由路径重复计算，但项目注册表本身不持久化。
