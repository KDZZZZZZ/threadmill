openapi: 3.1.0
info:
  title: Threadmill Project Harness API
  version: 0.2.0
  description: Local Project HTTP/SSE adapter for the supplied WebUI. Unified ordinary Tasks/Edges; no root/Join
    semantics. Same-process snapshot resync, no historical SSE replay. Integer nanosecond durations. See ui-agent-api.md
    for implemented limits.
servers:
- url: http://127.0.0.1:8787
  description: 本地网关默认地址；页面与 API 同源。可信本机代理可用 -web-origin 配置精确外部来源，网关仍监听 loopback；见 ui-agent-api.md。
security: []
tags:
- name: projects
- name: messages
- name: agents
- name: events
- name: graph
- name: metrics
- name: health
paths:
  /healthz:
    get:
      tags:
      - health
      operationId: healthz
      summary: 存活探测
      responses:
        '200':
          description: 进程存活
          content:
            application/json:
              schema:
                type: object
                required:
                - status
                - service
                properties:
                  status:
                    type: string
                    const: ok
                  service:
                    type: string
                    const: threadmill-webui
        '403':
          $ref: '#/components/responses/Forbidden'
      x-implementation-status: implemented
  /api/v1/projects:
    get:
      tags:
      - projects
      operationId: listProjects
      summary: 列出项目
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 返回当前网关进程内登记的项目，按 canonical root 排序；网关重启后列表为空，不扫描持久状态目录。
    post:
      tags:
      - projects
      operationId: openProject
      summary: 打开或复用项目
      x-implementation-status: implemented
      responses:
        '200':
          description: 复用当前项目，或重新打开已关闭/失败的 Manager 实例；Project ID 不变
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '201':
          description: 当前网关首次打开该项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 状态或幂等键冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: 项目路径有效，但 Manager 打开或配置加载失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '503':
          description: 网关正在停止，不再接受打开项目
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 服务端先校验已有目录并按 Abs → EvalSymlinks → Clean 规范化路径。项目 ID 由 canonical root 的 SHA-256 派生；同一网关进程内串行 get-or-open，使并发别名和多个浏览器复用一个
        Manager。该互斥不覆盖另一个网关进程或单独 CLI。 关闭后再次打开复用 Project ID 和现存进程内消息，启动新的 Manager 实例；历史仍无跨网关重启保证。 重新 manager.Open
        可能按已有运行时逻辑恢复未完成工作；该恢复独立于 HTTP 消息幂等收据。 显式打开 runtime_state=error 的项目会关闭失败的运行实例并重新调用 manager.Open，保留 Project
        ID、收据和仍在缓存中的消息。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenProjectRequest'
  /api/v1/projects/{project_id}:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - projects
      operationId: getProject
      summary: 查询项目与唯一 Manager 状态
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/projects/{project_id}/messages:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - messages
      operationId: listMessages
      summary: 读取与 Manager 的对话历史
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessagePage'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 返回当前网关进程内最近 256 条用户与 Manager 显示消息，不读取 worker 记忆。不支持 before/limit 分页，next_before 恒为 null；重启后记录不恢复。
    post:
      tags:
      - messages
      operationId: sendMessage
      summary: 给 Manager 发消息
      x-implementation-status: implemented
      responses:
        '202':
          description: 已入队
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 项目已关闭、Manager 主循环已失败，或相同 client_message_id 对应不同正文
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          description: 当前项目进程内收据达到 10000 个上限，拒绝新 client_message_id；已有键仍可重试
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 调用 Manager.Send(content)，忙时沿用现有 FIFO，不新建 session。相同项目内 client_message_id 与正文均相同的重试复用原收据；同键不同正文返回
        409。去重仅在当前网关进程内有效，不保证跨重启或崩溃的 exactly-once。 每项目最多保留 10000 个收据；达到上限后新幂等键返回 429，已有键仍可查询原收据。 Manager 主循环已失败时拒绝新消息（409），需显式
        POST /api/v1/projects 重新打开；已有同正文收据仍按幂等规则返回，不再次发送。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
  /api/v1/projects/{project_id}/cancel:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - messages
      operationId: cancelProject
      summary: 请求停止当前工作
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelResult'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      description: '沿用 Manager.Cancel：优先取消当前任务树，否则抢占 manager 当前轮。不是清空所有排队消息，不是关闭项目，也不等于已停止。UI 等终态事件/快照后再标记 canceled；排队输入仍可能启动下一轮。
        POST 仍需 Content-Type: application/json，请求体为一个空对象。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
  /api/v1/projects/{project_id}/close:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    post:
      tags:
      - projects
      operationId: closeProject
      summary: 关闭运行实例，保留项目登记和缓存
      x-implementation-status: implemented
      responses:
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '200':
          description: Manager.Close 完成，返回 runtime_state=closed 的 Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      description: '关闭当前 Manager，保留网关内 Project 登记与消息缓存；再次 POST 相同 root 会重新打开该 Project。多个浏览器共享同一实例，浏览器断开 SSE 不自动关闭项目。此操作不删除项目目录或运行时持久状态；缓存仍不跨网关重启保存。
        POST 仍需 Content-Type: application/json，请求体为一个空对象。'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
            example: {}
  /api/v1/projects/{project_id}/agents:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - agents
      operationId: listAgents
      summary: 查看只读 Agent 状态
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentList'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: 由项目协调图、生命周期事件与适配层显示状态投影。不能向 worker 发消息、创建 worker session 或直接更改其图状态。
  /api/v1/projects/{project_id}/graph:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - graph
      operationId: getGraph
      summary: 获取当前协调图
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphSnapshot'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 项目已关闭，需按相同路径重新打开
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 仅调用 Manager.Snapshot。返回一次完整当前快照；不增加历史 revision API，不绕过 Manager 去访问 graph 私有字段。
  /api/v1/projects/{project_id}/metrics:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - metrics
      operationId: getMetrics
      summary: 获取运行指标
      x-implementation-status: implemented
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Metrics'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 项目已关闭，需按相同路径重新打开
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 调用 Manager.Metrics。所有 Go time.Duration 均为纳秒整数；前端换算，不把它当毫秒。
  /api/v1/projects/{project_id}/events:
    parameters:
    - name: project_id
      in: path
      required: true
      schema:
        type: string
    get:
      tags:
      - events
      operationId: streamProjectEvents
      summary: 订阅项目状态与 Manager 输出
      x-implementation-status: implemented
      responses:
        '200':
          description: SSE 流
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/EventStreamPayload'
              examples:
                workerTool:
                  summary: 'event: runtime_event；只读进度'
                  value:
                    project_id: project-threadmill
                    seq: '42'
                    data:
                      time: '2026-09-11T09:30:00Z'
                      agent_id: task-2:executor
                      kind: tool
                      phase: start
                      name: bash
                      call_id: call-7
                managerMessage:
                  summary: 'event: output；完整消息替换流式文本'
                  value:
                    project_id: project-threadmill
                    seq: '43'
                    data:
                      id: message-3
                      speaker: manager
                      kind: message
                      content: 接口已整理，正在验证演示。
                      status: complete
                      created_at: '2026-09-11T09:30:01Z'
                managerReasoning:
                  summary: 'event: runtime_event；上游显式推理明文，独立于正文'
                  value:
                    project_id: project-example
                    seq: '44'
                    data:
                      time: '2026-09-11T09:30:02Z'
                      agent_id: manager
                      kind: model
                      phase: delta
                      reasoning_delta: '[上游提供的推理明文增量]'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 项目已关闭，需按相同路径重新打开
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      description: 'SSE event 为 snapshot/runtime_event/output，业务 id 等于 envelope.seq。每次连接先发送当前显示快照，再发送后续事件。seq 只在当前网关项目内有效，重启会重置。当前不实现事件回放；Last-Event-ID
        和 since 不用于恢复，客户端重连时接受新快照并替换视图。切换项目必须关闭旧连接并丢弃迟到帧。快照 reasoning 仅恢复每个 agent 最近一次模型调用的明文尾部（最多 64 KiB），不提供完整推理历史或工具日志。
        每 15 秒发送 SSE 注释 : heartbeat 保活，不产生业务 event/id。 每个订阅者最多缓冲 64 帧；队列满时断开该订阅，由客户端重连获取快照，不阻塞 Agent。单次写入超时为 10
        秒。 SSE 不周期发送状态快照；当前 HTML 每 1500ms 读取活动项目及 agents/graph 接口，以更新 Busy 和终态。

        stream_reset 撤回一次失败模型响应的未完成正文和推理，随后进入重试。完整输出及用户消息不受影响。仅可显式撤回的 WebUI 接收通道启用此能力；普通输出流仍禁止重复交付。'
      x-stream-reset-schema:
        $ref: '#/components/schemas/StreamReset'
components:
  responses:
    BadRequest:
      description: 请求不合法
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: 项目不存在
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: 服务端错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: 请求 Host/Origin 不属于当前本地网关，或 Sec-Fetch-Site 为 cross-site
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: 'POST 必须使用 Content-Type: application/json'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: JSON 请求体超过 64 KiB
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - message
          properties:
            message:
              type: string
      example:
        error:
          message: project not found
    SendMessageRequest:
      type: object
      required:
      - content
      - client_message_id
      properties:
        content:
          type: string
          minLength: 1
        client_message_id:
          type: string
          minLength: 1
          description: 非空、UTF-8 编码最多 256 字节的客户端幂等键。当前网关同项目内重复键同正文返回原收据，不再 Send；不同正文返回 409。收据不跨网关重启恢复。 每项目缓存最多 10000
            个收据，满后拒绝新键（429）。
          maxLength: 256
      additionalProperties: false
      description: 始终只发送给 Manager；不接受 agent_id、session_id 或其他未知字段。正文不得为空白，client_message_id 不得为空且 UTF-8 编码最多 256
        字节；JSON body 上限 64 KiB，不允许尾随 JSON。
    CancelResult:
      type: object
      required:
      - canceled
      properties:
        canceled:
          type: boolean
          description: 是否真的取消了某个任务树或经理轮；false 表示当时没有可取消的工作。
    RuntimeEvent:
      type: object
      description: 源类型为 event.RuntimeEvent。外发时剥离非 Manager 正文 delta；所有角色的 reasoning_delta 可用于只读观测，仅承载 provider 显式提供的推理明文，独立于正文。摘要、加密
        reasoning 和未公开内部思考不进入该字段。
      required:
      - time
      - kind
      - phase
      properties:
        time:
          type: string
          format: date-time
        agent_id:
          type: string
          description: manager；角色 agent 为 task-<n>:planner|executor|verifier；task 生命周期事件则为 task-<n>。
        kind:
          $ref: '#/components/schemas/EventKind'
        phase:
          $ref: '#/components/schemas/EventPhase'
        name:
          type: string
          description: 模型名、工具名或任务终态（`done`/`failed`/`canceled`）。
        call_id:
          type: string
        duration:
          type: integer
          format: int64
          description: 纳秒；Go `time.Duration`。
        error:
          type: string
        is_error:
          type: boolean
        messages:
          type: integer
        tools:
          type: integer
        tool_calls:
          type: integer
        tokens:
          type: integer
        input_tokens:
          type: integer
        cached_tokens:
          type: integer
        cache_write_tokens:
          type: integer
        retries:
          type: integer
        retry_reason:
          type: string
        delta:
          type: string
          description: 仅 manager 的 kind=model, phase=delta 正文向 UI 发布并进入对话；非 manager 正文在网关剥离。
        stream_text:
          type: boolean
          description: 记忆操作的流活动标记，不携带正文。
        memory_organized:
          type: boolean
        memory_candidates:
          type: integer
        memory_selected:
          type: integer
        reasoning_delta:
          type: string
          description: provider 显式提供的推理明文增量，保留收到的文本；所有角色可用于 Thinking 观测，与正文 delta 分离。没有上游明文时省略，不从 summary、encrypted
            reasoning 或最终答案生成原始思维链。
    EventKind:
      type: string
      enum:
      - model
      - tool
      - task
      - memory
    EventPhase:
      type: string
      enum:
      - start
      - end
      - delta
      - retry
    GraphSnapshot:
      type: object
      description: Read-only coordination Snapshot; task/node fields follow existing PascalCase, edges use from/to.
        Immutable output bodies and internal storage references are omitted by the adapter.
      required:
      - revision
      - executing
      - tasks
      - edges
      properties:
        revision:
          type: integer
          format: int64
        executing:
          type: boolean
          description: Run 期间为 true。
        publishing_task_id:
          type: string
        published_task_id:
          type: string
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/GraphTask'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/GraphEdge'
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/GraphNode'
        publishing_node_id:
          type: string
        published_node_id:
          type: string
    GraphTask:
      type: object
      description: planner → executor → verifier 的固定三角色序列。
      properties:
        ID:
          type: string
        Info:
          type: string
          description: 任务目标与验收标准。
        Env:
          $ref: '#/components/schemas/GraphEnv'
        Planner:
          $ref: '#/components/schemas/GraphNode'
        Executor:
          $ref: '#/components/schemas/GraphNode'
        Verifier:
          $ref: '#/components/schemas/GraphNode'
        Outcome:
          type: string
          enum:
          - active
          - done
          - canceled
          - failed
          - idle
          - closed
        RunPolicy:
          type: string
          enum:
          - enabled
          - held
        Persistent:
          type: boolean
        Activation:
          type: integer
          minimum: 1
    GraphNode:
      type: object
      properties:
        ID:
          type: string
          description: Opaque node ID from the graph, including activation and optional checkpoint; never reconstruct
            IDs in the UI.
        TaskID:
          type: string
        Role:
          type: string
          enum:
          - planner
          - executor
          - verifier
    GraphEnv:
      type: object
      description: Activation environment identity; not a host path.
      properties:
        ID:
          type: string
    GraphEdge:
      type: object
      required:
      - from
      - to
      properties:
        from:
          type: string
        to:
          type: string
    Metrics:
      type: object
      description: 对应 `manager.Metrics`。
      required:
      - time
      - tasks
      - events
      - runtime
      properties:
        time:
          type: string
          format: date-time
        uptime:
          type: integer
          format: int64
