      - queue_depth
      properties:
        accepted:
          type: boolean
          const: true
        message_id:
          type: string
        queue_depth:
          type: integer
          minimum: 0
      description: 入队收据，不表示任务完成。message_id 和 client_message_id 去重记录属于当前网关进程，重启后不恢复。
    Message:
      type: object
      required:
      - id
      - speaker
      - kind
      - content
      - status
      - created_at
      properties:
        id:
          type: string
          description: 当前网关项目内的消息 ID；用于正文增量与完整输出关联，不是跨重启持久 ID。
        speaker:
          type: string
          enum:
          - user
          - manager
        kind:
          type: string
          enum:
          - message
          - task_report
        content:
          type: string
        status:
          type: string
          enum:
          - queued
          - streaming
          - complete
          - canceled
          - error
        created_at:
          type: string
          format: date-time
      description: 当前网关进程内的显示消息。只有 user 与 manager 为发言者；task_report 由 Manager 输出通道转交。完整 output 按 id 替换流式正文，不附带隐藏记忆。
        GET messages 仅保留最近 256 条，旧消息可能已移出显示缓存。
    MessagePage:
      type: object
      required:
      - items
      - next_before
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Message'
          maxItems: 256
        next_before:
          type: 'null'
          description: 当前无分页，恒为 null。
      description: 当前网关保存的最近最多 256 条显示消息，按创建顺序返回；没有历史分页或重启恢复。
    Agent:
      type: object
      required:
      - id
      - task_id
      - role
      - state
      - activity
      - updated_at
      - current_tool
      - completed_steps
      - total_steps
      - can_message
      properties:
        id:
          type: string
          description: Canonical manager, organizer or current activation role identity from the adapter.
        task_id:
          type:
          - string
          - 'null'
        role:
          type: string
          enum:
          - manager
          - planner
          - executor
          - verifier
          - organizer
        state:
          type: string
          enum:
          - queued
          - running
          - waiting
          - idle
          - done
          - failed
          - canceled
          - unknown
          - closed
        activity:
          type: string
          description: 由真实生命周期或工具事件生成的活动标签；不编造工具参数、文件路径、命令输出或原始推理。
        updated_at:
          type: string
          format: date-time
        current_tool:
          type:
          - string
          - 'null'
        completed_steps:
          type: integer
          minimum: 0
        total_steps:
          type: 'null'
          description: 当前没有可靠总步数，恒为 null。
        can_message:
          type: boolean
          description: 仅 manager 为 true。
      description: 只读显示投影，不是新业务角色。无可验证的总量时 total_steps=null，展示阶段/活动，不伪造百分比；没有可靠角色状态时 unknown。
    AgentList:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
    ProjectSnapshot:
      type: object
      required:
      - project
      - agents
      - graph
      - metrics
      - messages
      - reasoning
      properties:
        project:
          $ref: '#/components/schemas/Project'
        agents:
          type: array
          items:
            $ref: '#/components/schemas/Agent'
        graph:
          $ref: '#/components/schemas/GraphSnapshot'
        metrics:
          $ref: '#/components/schemas/Metrics'
        messages:
          $ref: '#/components/schemas/MessagePage'
        reasoning:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/ReasoningState'
          description: 以 agent_id 为键的最近一次模型推理状态；可用于重连恢复有限明文尾部，不是完整历史。
      description: 当前显示层采集的项目、消息、agent、推理、图与指标；不是数据库事务快照，也不保证 Busy/Snapshot/Metrics 的多次调用天然原子。reasoning 只保留各 agent
        最近一次模型调用的明文尾部，不恢复完整工具日志或旧调用历史。
    SnapshotEvent:
      type: object
      required:
      - project_id
      - seq
      - data
      properties:
        project_id:
          type: string
        seq:
          type: string
          pattern: ^[0-9]+$
          description: 当前网关进程内、当前项目的单调递增序号；十进制字符串避免 JS 整数精度损失。网关重启后重置，不能作为持久回放游标。
        data:
          $ref: '#/components/schemas/ProjectSnapshot'
      description: 'event: snapshot。每次连接和重连发送当前显示快照。即使 seq 小于上次连接也应接受，不能假定跨进程序号连续。'
    RuntimeEventEnvelope:
      type: object
      required:
      - project_id
      - seq
      - data
      properties:
        project_id:
          type: string
        seq:
          type: string
          pattern: ^[0-9]+$
          description: 当前网关进程内、当前项目的单调递增序号；十进制字符串避免 JS 整数精度损失。网关重启后重置，不能作为持久回放游标。
        data:
          $ref: '#/components/schemas/RuntimeEvent'
        message_id:
          type: string
          description: 仅 Manager 正文 delta 携带，对应完整 output 的同一消息 ID。reasoning_delta 按 agent_id 进入 Thinking 区，其他角色不成为对话发言者。
        role_agent_id:
          type: string
          description: Canonical role identity for activity aggregation; data.agent_id retains the exact event source/checkpoint.
      description: 'event: runtime_event。正文和 reasoning_delta 独立处理；只有 Manager 正文进入对话，其他 agent 没有用户消息入口。'
    OutputEvent:
      type: object
      required:
      - project_id
      - seq
      - data
      properties:
        project_id:
          type: string
        seq:
          type: string
          pattern: ^[0-9]+$
          description: 当前网关进程内、当前项目的单调递增序号；十进制字符串避免 JS 整数精度损失。网关重启后重置，不能作为持久回放游标。
        data:
          $ref: '#/components/schemas/Message'
      description: 'event: output。完整 user/manager 显示消息，以 id upsert；相同 ID 的正文由完整内容替换，禁止再次追加全文。'
    EventStreamPayload:
      description: SSE 每帧 data 的 JSON 对象；event 字段决定类型。不是普通 JSON 响应。
      oneOf:
      - $ref: '#/components/schemas/SnapshotEvent'
      - $ref: '#/components/schemas/RuntimeEventEnvelope'
      - $ref: '#/components/schemas/OutputEvent'
    ReasoningState:
      type: object
      required:
      - text
      - started_at
      - duration
      - running
      - truncated
      properties:
        text:
          type: string
          description: 该 agent 最近一次模型调用的上游显式推理明文；最多保留末尾 64 KiB，截断时 truncated=true。
        started_at:
          type: string
          format: date-time
        duration:
          type: integer
          format: int64
          description: 该次模型调用已记录时长，纳秒。
        running:
          type: boolean
        truncated:
          type: boolean
          description: true 表示较早文字已从快照缓存截去；不能把该片段标记为完整原文。
    StreamReset:
      type: object
      required:
      - project_id
      - seq
      - data
      properties:
        project_id:
          type: string
        seq:
          type: string
        data:
          type: object
          required:
          - message_id
          - agent_id
          properties:
            message_id:
              type: string
              description: Discard this incomplete message; empty when only reasoning was streamed.
            agent_id:
              const: manager
