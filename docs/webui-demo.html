@media(max-width:600px){.app,.app.collapsed{display:flex}.workspace{flex:1}.sidebar{display:none}.sidebar.visible{display:flex;position:fixed;left:0;top:0;bottom:0;width:224px;z-index:7;background:var(--page);box-shadow:10px 0 35px #0004}.sidebar-inner{width:224px}.nav-row{width:208px}.mobile-only{display:grid}.panel-heading{height:64px;padding:0 20px;gap:9px}.conversation{padding:28px 22px}.message-body{font-size:13px}.message.user{margin-left:20px}.workspace{--composer-inset:18px}.composer-wrap{bottom:12px}.empty{margin-top:13vh}}

/* The composer floats over the conversation; only the pill occupies the bottom. */
#conversation{padding-bottom:96px}
#chat-scroll{scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;scrollbar-gutter:stable;scroll-padding-bottom:96px}
#chat-scroll:hover{scrollbar-color:var(--ink-3) transparent}
#chat-scroll::-webkit-scrollbar{width:10px}
#chat-scroll::-webkit-scrollbar-track{background:transparent}
#chat-scroll::-webkit-scrollbar-thumb{background:var(--line-strong);border:3px solid transparent;border-radius:10px;background-clip:padding-box}
#chat-scroll::-webkit-scrollbar-thumb:hover{background-color:var(--ink-3)}
#chat-scroll::-webkit-scrollbar-button{display:none}
.thinking>summary{transition:background-color 160ms,color 160ms}
.thinking>summary:focus-visible{outline:2px solid var(--ink-3);outline-offset:3px}
@supports (interpolate-size:allow-keywords){
 .thinking{interpolate-size:allow-keywords}
 .thinking::details-content{block-size:0;opacity:0;overflow:clip;transition:block-size 240ms cubic-bezier(.22,1,.36,1),opacity 180ms ease,content-visibility 240ms allow-discrete}
 .thinking[open]::details-content{block-size:auto;opacity:1}
}
@media(prefers-reduced-motion:reduce){.thinking::details-content,.thinking>summary,.thinking .chevron{transition:none!important}}

/* Markdown is scoped to chat content; traces and tool output remain verbatim. */
.markdown{white-space:normal;line-height:1.8;min-width:0}
.markdown>:first-child{margin-top:0}.markdown>:last-child{margin-bottom:0}
.markdown p,.markdown ul,.markdown ol,.markdown blockquote,.markdown pre,.markdown .md-table{margin:0 0 1em}
.markdown h1,.markdown h2,.markdown h3,.markdown h4,.markdown h5,.markdown h6{line-height:1.4;font-weight:600;margin:1.3em 0 .6em;color:var(--ink)}
.markdown h1{font-size:1.5em}.markdown h2{font-size:1.3em}.markdown h3{font-size:1.15em}.markdown h4,.markdown h5,.markdown h6{font-size:1em}
.markdown strong{font-weight:650}.markdown em{font-style:italic}.markdown del{color:var(--ink-3)}
.markdown ul,.markdown ol{padding-left:1.6em}.markdown ul{list-style:disc}.markdown ol{list-style:decimal}.markdown ul ul{list-style:circle}
.markdown li{padding-left:.15em;margin:.25em 0}.markdown li>ul,.markdown li>ol{margin:.25em 0}.markdown li>p{margin:.4em 0}
.markdown blockquote{padding:.15em 0 .15em 1em;border-left:3px solid var(--line-strong);color:var(--ink-2)}.markdown blockquote>:last-child{margin-bottom:0}
.markdown a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere}.markdown a:hover{color:var(--ink-2)}
.markdown code{font: .9em/1.6 var(--mono);background:var(--inset);border:1px solid var(--line-soft);border-radius:4px;padding:.12em .35em;white-space:break-spaces}
.markdown pre{max-width:100%;overflow:auto;white-space:pre;background:var(--inset);border:1px solid var(--line);border-radius:9px;padding:14px 16px;tab-size:4}
.markdown pre code{display:block;min-width:max-content;white-space:pre;border:0;border-radius:0;padding:0;background:none;font-size:12px}
.markdown .md-table{max-width:100%;overflow:auto;border:1px solid var(--line);border-radius:8px}
.markdown table{border-collapse:collapse;min-width:100%;font-size:.95em}.markdown th,.markdown td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;min-width:90px}
.markdown th{font-weight:600;background:var(--hover-2)}.markdown tr:last-child td{border-bottom:0}.markdown [align=center]{text-align:center}.markdown [align=right]{text-align:right}
.markdown hr{border:0;border-top:1px solid var(--line);margin:1.4em 0}.markdown img{max-width:100%;height:auto;border-radius:6px}
.markdown input[type=checkbox]{margin-right:.5em;accent-color:var(--ink-2)}
</style>

'use strict';

// BEGIN CHAT MARKDOWN
const markdownParser=new marked.Marked({gfm:true,breaks:true,renderer:{html:({text})=>esc(text)}});

  RETURN_DOM_FRAGMENT:true,ALLOW_DATA_ATTR:false,ALLOW_ARIA_ATTR:false,
  ALLOWED_TAGS:['p','br','hr','h1','h2','h3','h4','h5','h6','strong','em','del','blockquote','ul','ol','li','pre','code','a','img','table','thead','tbody','tr','th','td','input'],
  ALLOWED_ATTR:['href','title','src','alt','class','align','start','type','checked','disabled']
 });
 for(const a of fragment.querySelectorAll('a[href]')){a.target='_blank';a.rel='noopener noreferrer';}

 for(const table of fragment.querySelectorAll('table')){const wrap=document.createElement('div');wrap.className='md-table';wrap.tabIndex=0;wrap.setAttribute('aria-label','Table');table.replaceWith(wrap);wrap.append(table);}

// END CHAT MARKDOWN

const icon=(name,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const projects=new Map(); let activeId=null,mode='connecting',stream=null,streamGeneration=0,toastTimer,paused=false;
const current=()=>projects.get(activeId);const uid=()=>crypto.randomUUID();
const stateLabel=s=>({running:'Running',active:'Running',idle:'Idle',done:'Completed',completed:'Completed',waiting:'Waiting',queued:'Queued',canceled:'Stopped',failed:'Failed',error:'Failed',unknown:'Unknown',held:'Waiting',pending:'Waiting'}[s]||s||'Unknown');
const elapsed=ms=>ms<60000?`${(ms/1000).toFixed(1)}s`:`${Math.floor(ms/60000)}m ${((ms%60000)/1000).toFixed(1)}s`;
function project(raw){return {...raw,messages:[],agents:[],graph:{tasks:[],edges:[]},taskOutcomes:{},traces:{},activity:[],draft:'',lastSeq:null,connected:false,queue:[],demoSeconds:0,details:new Set(),sending:false,refreshing:false,busySince:null,graphView:{x:0,y:0,scale:1}};}
function notify(message){clearTimeout(toastTimer);$('#toast').textContent=message;$('#toast').hidden=false;toastTimer=setTimeout(()=>$('#toast').hidden=true,4000);}
async function api(path,body){const r=await fetch(path,{method:body===undefined?'GET':'POST',headers:body===undefined?{}:{'Content-Type':'application/json'},body:body===undefined?undefined:JSON.stringify(body)});let data;try{data=await r.json();}catch{throw Error('Invalid response from the local service.');}if(!r.ok)throw Error(data.error?.message||data.message||String(data.error||`HTTP ${r.status}`));return data;}
function endpoint(p,tail=''){return `/api/v1/projects/${encodeURIComponent(p.id)}${tail}`;}
function saveDetails(p){if(!p)return;p.details=new Set($$('details[data-detail][open]').map(x=>x.dataset.detail));}
function restoreDetails(p){$$('details[data-detail]').forEach(x=>x.open=p.details.has(x.dataset.detail));$$('[data-trace]').forEach(x=>{x.textContent=p.traces[x.dataset.trace]?.text||'No reasoning available.';});}
function renderProjects(){const filter=$('#project-search').value.trim().toLowerCase();$('#project-list').innerHTML=[...projects.values()].filter(p=>`${p.name} ${p.root}`.toLowerCase().includes(filter)).map(p=>`<button class="nav-row ${p.id===activeId?'selected':''}" data-project="${esc(p.id)}" title="${esc(p.root)}" ${p.id===activeId?'aria-current="page"':''}><span class="nav-copy">${esc([...projects.values()].filter(x=>x.name===p.name).length>1?p.root.split('/').slice(-2).join('/'):p.name)}</span><span class="dot ${p.busy?'running':p.runtime_state==='error'?'error':''}"></span></button>`).join('');}
function loader(p){return `<div class="loading-state"><span class="loader-grid" aria-hidden="true">${[90,180,270,0,90,180,90,180,270].map(n=>`<i style="animation-delay:${n}ms"></i>`).join('')}</span><span class="loader-label shimmer">${p.runtime_state==='error'?'Manager stopped · Work unfinished':'Working'}</span><span class="elapsed" data-clock="manager"></span></div>`;}
function thinking(p,agentID,location='conversation'){const t=p.traces[agentID];const title=t?.running?'Thinking':t?'Thought for '+elapsed(t.duration||0):'Thinking';return `<details class="thinking" data-detail="thinking:${location}:${esc(agentID)}"${p.details.has(`thinking:${location}:${agentID}`)?' open':''}><summary>${icon('sparkle','sparkle')}<span class="${t?.running?'shimmer':''}">${esc(title)}</span>${icon('chevron','chevron')}</summary><div class="trace-wrap"><pre class="trace" data-trace="${esc(agentID)}"></pre>${t?.truncated?'<p class="trace-note">Only the most recent reasoning is retained.</p>':t?.partial?'<p class="trace-note">Reconnected. Earlier reasoning may be incomplete.</p>':''}</div></details>`;}
function managerActions(p){
 return p.activity.filter(item=>item.agent_id==='manager'&&item.kind!=='model'&&item.state==='running').slice(-3).map(item=>{
  const label=item.kind==='memory'?'Organizing memory':/read/.test(item.name)?'Reading':/write|edit/.test(item.name)?'Writing':/exec|run/.test(item.name)?'Running':item.name;
  return `<details class="thinking action-event" data-detail="action:${esc(item.id)}"${p.details.has(`action:${item.id}`)?' open':''}><summary>${icon(item.icon)}<span class="shimmer">${esc(label)}${item.retries?' · Retrying ('+item.retries+')':''}</span>${icon('chevron','chevron')}</summary><div class="trace-wrap"><pre class="trace">${esc([item.name,item.call_id||''].filter(Boolean).join('\n'))}</pre></div></details>`;
 }).join('');
}
function renderMessages(){
 const p=current(),box=$('#conversation');
 if(!p){box.innerHTML='<div class="empty">'+icon('folder')+'<h2>Open a project</h2><p>Choose a path on the Threadmill host to start working with Manager.</p><button id="empty-open">Open project →</button></div>';box._markup=null;$('#composer-wrap').hidden=true;return;}
 // Active progress follows a new user message until the next Manager reply exists.
 const footerMessage=p.busy&&p.messages.at(-1)?.speaker==='user'?-1:p.messages.findLastIndex(m=>m.speaker==='manager');
 const footer=(p.busy||p.traces.manager)?`${p.traces.manager?thinking(p,'manager'):''}${managerActions(p)}${p.busy?loader(p):''}`:'';
 let markup=p.messages.map((m,i)=>m.speaker==='user'?`<article class="message user"><div class="user-text markdown">${renderMarkdown(m)}</div><div class="message-meta">${m.status==='queued'?'Sent':m.status==='error'?'Failed to send':''}</div></article>`:`<article class="message manager" data-message="${esc(m.id)}"><div class="message-meta">${icon('logo')}<strong>Manager</strong>${m.kind==='task_report'?'<span>Task report</span>':''}</div>${m.kind==='task_report'?`<details class="thinking" data-detail="report:${esc(m.id)}"${p.details.has(`report:${m.id}`)?' open':''}><summary>${icon('check')}<span>${esc(m.content.split('\n')[0]||'View task report')}</span>${icon('chevron','chevron')}</summary><div class="message-body markdown">${renderMarkdown(m)}</div></details>`:`<div class="message-body markdown">${renderMarkdown(m)}</div>`}${['error','canceled'].includes(m.status)?`<p class="message-error">${stateLabel(m.status)}</p>`:''}${i===footerMessage?footer:''}</article>`).join('');
 if(footerMessage<0&&footer)markup+=`<article class="message manager"><div class="message-meta">${icon('logo')}<strong>Manager</strong></div>${footer}</article>`;
 if(!p.messages.length&&!footer)markup='<div class="empty">'+icon('logo')+'<h2>'+esc(p.name)+'</h2><p>Tell Manager what you want to work on.</p></div>';
 if(box._markup!==markup){box.innerHTML=markup;box._markup=markup;}
 $('#composer-wrap').hidden=false;$('#prompt').disabled=p.runtime_state!=='open';$('#send').disabled=p.runtime_state!=='open'||!p.draft.trim()||p.sending;
}
function agentIcon(id){return id==='manager'?'logo':id.includes('organizer')?'memory':id.endsWith(':planner')?'sparkle':id.endsWith(':verifier')?'check':'run';}
function agentState(p,id){const a=p.agents.find(a=>a.id===id);return a?.current_tool==='coordination_requestHelp'?'waiting':a?.state||'unknown';}

}
function visibleActivity(p){
 const tasks=new Set(liveTasks(p).map(t=>t.ID));
 return p.activity.filter(item=>item.agent_id==='manager'?p.runtime_state==='open'&&p.busy:tasks.has(taskForAgent(p,item.agent_id))||(p.agents.find(a=>a.id===item.agent_id)?.role==='organizer'&&(p.busy||agentState(p,item.agent_id)==='running')));
}

function renderGraph(){
 const p=current(),tasks=p?liveTasks(p):[],managerState=p?agentState(p,'manager'):'unknown';const graph=$('#graph-content');

 if(graph._markup!==markup){graph.innerHTML=markup;graph._markup=markup;}applyGraphTransform();
}

    suppressClick ||= previous.moved;
    viewport.style.cursor = 'grab';
    if (viewport.hasPointerCapture(previous.id)) viewport.releasePointerCapture(previous.id);
  }

  function zoomAt(factor, clientX, clientY) {
    const p = current(), content = $('#graph-content');
    if (!p || !content) return;
    applyGraphTransform();
    const view = p.graphView, rect = content.getBoundingClientRect();
    const next = Math.min(2.5, Math.max(.35, view.scale * factor));
    view.x += (clientX - rect.left) * (1 - next / view.scale);
    view.y += (clientY - rect.top) * (1 - next / view.scale);
    view.scale = next;
    applyGraphTransform();
  }

  viewport.addEventListener('pointerdown', event => {
    const p = current();
    if (!p || drag || event.button !== 0 || !event.isPrimary || editable(event.target)) return;
    suppressClick = false;
    applyGraphTransform();
    drag = {id: event.pointerId, project: p, clientX: event.clientX, clientY: event.clientY,
      x: p.graphView.x, y: p.graphView.y, moved: false};
    if (!event.target.closest('button, a')) viewport.focus({preventScroll: true});
  });
  // Capture only after the drag threshold, so an ordinary node click retains its target.
  // https://developer.mozilla.org/en-US/docs/Web/API/Element/setPointerCapture
  window.addEventListener('pointermove', event => {
    if (!drag || event.pointerId !== drag.id) return;
    if (current() !== drag.project) { endDrag(event); return; }
    const dx = event.clientX - drag.clientX, dy = event.clientY - drag.clientY;
    if (!drag.moved) {
      if (Math.hypot(dx, dy) < 4) return;
      drag.moved = true;
      viewport.setPointerCapture(event.pointerId);
      viewport.style.cursor = 'grabbing';
      viewport.focus({preventScroll: true});
    }
    event.preventDefault();
    drag.project.graphView.x = drag.x + dx;
    drag.project.graphView.y = drag.y + dy;
    applyGraphTransform();
  }, {passive: false});
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  viewport.addEventListener('lostpointercapture', endDrag);
  window.addEventListener('blur', () => endDrag());
  viewport.addEventListener('click', event => {
    if (!suppressClick || event.detail === 0) return;
    suppressClick = false;
    event.preventDefault();
    event.stopImmediatePropagation();
  }, true);

  // The non-passive listener is confined to the graph, leaving page scrolling elsewhere intact.
  // https://developer.mozilla.org/en-US/docs/Web/API/Element/wheel_event
  // https://developer.mozilla.org/en-US/docs/Web/CSS/touch-action
  viewport.addEventListener('wheel', event => {
    if (!current() || !$('#graph-content') || !event.deltaY || editable(event.target)) return;
    event.preventDefault();
    endDrag();
    const pixels = event.deltaY * (event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1);
    zoomAt(Math.exp(-pixels * .0015), event.clientX, event.clientY);
  }, {passive: false});
  viewport.addEventListener('dblclick', event => {
    const p = current();
    if (!p || editable(event.target)) return;
    event.preventDefault();
    endDrag();
    p.graphView = {x: 0, y: 0, scale: 1};
    applyGraphTransform();
  });
  viewport.addEventListener('keydown', event => {
    const p = current();
    if (!p || editable(event.target) || event.altKey || event.ctrlKey || event.metaKey) return;
    if (!['+', '=', '-', '0', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(event.key)) return;
    event.preventDefault();
    event.stopPropagation();
    endDrag();
    applyGraphTransform();
    if (event.key === '0') p.graphView = {x: 0, y: 0, scale: 1};
    else if (['+', '=', '-'].includes(event.key)) {
      const rect = viewport.getBoundingClientRect();
      zoomAt(event.key === '-' ? 1 / 1.2 : 1.2, rect.left + rect.width / 2, rect.top + rect.height / 2);
    } else {
      p.graphView.x += event.key === 'ArrowLeft' ? -32 : event.key === 'ArrowRight' ? 32 : 0;
      p.graphView.y += event.key === 'ArrowUp' ? -32 : event.key === 'ArrowDown' ? 32 : 0;
    }
    applyGraphTransform();
  });
  applyGraphTransform();
}

// Native splitters share the same collapse state as the navigation buttons.
function bindColumnResize() {
  const app = $('#app'), handles = {sidebar: $('#sidebar-resize'), swarm: $('#swarm-resize')};
  const classes = {sidebar: 'collapsed', swarm: 'swarm-collapsed'};
  const min = {sidebar: 176, swarm: 260}, max = {sidebar: 360, swarm: 560};
  const folded = {sidebar: 52, swarm: 0}, threshold = {sidebar: 112, swarm: 136};
  const preferred = {sidebar: null, swarm: null}, defaults = {}, sizes = {};
  let active = null;
  const desktop = () => innerWidth > 900;
  const collapsed = key => app.classList.contains(classes[key]);
  const occupied = key => collapsed(key) ? folded[key] : sizes[key];
  const clamp = (value, low, high) => Math.max(low, Math.min(value, high));
  const limit = key => Math.max(min[key], Math.min(max[key], app.clientWidth - 320 - occupied(key === 'sidebar' ? 'swarm' : 'sidebar')));

  function readDefaults() {
    for (const key of Object.keys(handles)) app.style.removeProperty(`--${key}-width`);
    const style = getComputedStyle(app);
    defaults.sidebar = parseFloat(style.getPropertyValue('--sidebar-width')) || 224;
    defaults.swarm = parseFloat(style.getPropertyValue('--swarm-width')) || 344;
  }
  function sync() {
    for (const key of Object.keys(handles)) sizes[key] = clamp(preferred[key] ?? defaults[key], active?.key === key ? folded[key] : min[key], max[key]);
    if (desktop()) for (const key of Object.keys(handles)) if (!collapsed(key)) sizes[key] = Math.min(sizes[key], limit(key));
    for (const [key, handle] of Object.entries(handles)) {
      if (preferred[key] === null && sizes[key] === defaults[key]) app.style.removeProperty(`--${key}-width`);
      else app.style.setProperty(`--${key}-width`, `${sizes[key]}px`);
      handle.hidden = !desktop();
      handle.tabIndex = desktop() ? 0 : -1;
      handle.setAttribute('aria-valuemin', String(folded[key]));
      handle.setAttribute('aria-valuemax', String(Math.round(limit(key))));
      handle.setAttribute('aria-valuenow', String(Math.round(occupied(key))));
      handle.setAttribute('aria-valuetext', collapsed(key) ? 'Collapsed' : `${Math.round(sizes[key])} pixels`);
    }
    $('#sidebar-toggle').setAttribute('aria-label', collapsed('sidebar') ? 'Expand project navigation' : 'Collapse project navigation');
    $('#sidebar-toggle').title = $('#sidebar-toggle').getAttribute('aria-label');
    $('#inspector').inert = desktop() && collapsed('swarm');
    $('#project-section').inert = collapsed('sidebar') && innerWidth > 600;
    $('#project-fold').inert = (collapsed('sidebar') && innerWidth > 600) || $('#projects-toggle').getAttribute('aria-expanded') === 'false';
  }
  function stop() {
    if (!active) return;
    const {key, handle, pointerId, restore} = active;
    if (collapsed(key)) preferred[key] = restore;
    active = null;
    if (handle.hasPointerCapture(pointerId)) handle.releasePointerCapture(pointerId);
    handle.classList.remove('dragging');
    app.classList.remove('resizing');
    sync();
  }
  function resize(key, width) {
    // A small hysteresis prevents jitter when dragging back across the fold point.
    const fold = width < threshold[key] + (collapsed(key) ? 16 : 0);
    app.classList.toggle(classes[key], fold);
    if (!fold) preferred[key] = clamp(width, active ? folded[key] : min[key], limit(key));
    sync();
  }
  for (const [key, handle] of Object.entries(handles)) {
    handle.addEventListener('pointerdown', event => {
      if (event.button !== 0 || active || !desktop()) return;
      event.preventDefault();
      handle.focus({preventScroll: true});
      active = {key, handle, pointerId: event.pointerId, x: event.clientX, width: occupied(key), restore: preferred[key] ?? defaults[key]};
      app.classList.add('resizing');
      handle.classList.add('dragging');
      handle.setPointerCapture(event.pointerId);
    });
    handle.addEventListener('pointermove', event => {
      if (!active || active.pointerId !== event.pointerId || active.handle !== handle) return;
      event.preventDefault();
      resize(key, active.width + (event.clientX - active.x) * (key === 'sidebar' ? 1 : -1));
    });
    for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) handle.addEventListener(name, event => {
      if (active?.pointerId === event.pointerId) stop();
    });
    handle.addEventListener('keydown', event => {
      if (!desktop() || event.altKey || event.ctrlKey || event.metaKey || !['ArrowLeft', 'ArrowRight', 'Home', 'End', 'Enter'].includes(event.key)) return;
      event.preventDefault();
      const delta = (event.key === 'ArrowRight' ? 16 : -16) * (key === 'sidebar' ? 1 : -1);
      if (event.key === 'Enter') resize(key, collapsed(key) ? preferred[key] ?? defaults[key] : folded[key]);
      else if (event.key === 'Home') resize(key, folded[key]);
      else if (event.key === 'End') resize(key, limit(key));
      else resize(key, collapsed(key) ? delta > 0 ? preferred[key] ?? defaults[key] : folded[key] : delta < 0 && sizes[key] <= min[key] ? folded[key] : sizes[key] + delta);
    });
  }
  window.addEventListener('blur', stop);
  window.addEventListener('resize', () => { stop(); readDefaults(); sync(); });
  new MutationObserver(sync).observe(app, {attributes: true, attributeFilter: ['class']});
  readDefaults();
  sync();
}
