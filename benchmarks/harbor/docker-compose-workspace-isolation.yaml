services:
  main:
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor=unconfined
    volumes:
      # Bind both paths from one host filesystem so FICLONE/reflink works.
      - ${THREADMILL_PROJECTS_ROOT:?set to a reflink-capable host directory}/repo:/workspace/repo
      - ${THREADMILL_PROJECTS_ROOT:?set to the same host directory}/vfs:/threadmill-vfs
